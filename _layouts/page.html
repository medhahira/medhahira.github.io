---
layout: default
---
<div class="page-shell" data-animate>
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
    {% if page.pdf %}<p><a class="pdf-button" href="{{ page.pdf }}">Download PDF ↓</a></p>{% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</div>
